name = "brew-day-water-helper"
compatibility_date = "2024-12-01"
main = "src/worker.ts"
assets = { directory = "./dist" }

# ── Staging ──────────────────────────────────────────────────────────
[env.staging]
name = "brew-day-water-helper-staging"
routes = [{ pattern = "beer-dev.w7hak.com", custom_domain = true }]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "beer-db-dev"
database_id = "0dd11726-22be-4bf0-98c5-a0451a3de268"
migrations_dir = "../migrations"

# ── Production ───────────────────────────────────────────────────────
[env.production]
name = "brew-day-water-helper"
routes = [{ pattern = "beer.w7hak.com", custom_domain = true }]

[[env.production.d1_databases]]
binding = "DB"
database_name = "beer-db-prod"
database_id = "8466a0ec-7b87-4a39-a7a8-38d01202f85e"
migrations_dir = "../migrations"
